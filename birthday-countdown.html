<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>23 වැනි උපන්දිනය - Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700;900&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #07060a;
  --ink-2: #120f16;
  --gold: #f5c542;
  --gold-hi: #fff1b8;
  --gold-lo: #b8860b;
  --ruby: #c2185b;
  --emerald: #0f9d7a;
  --violet: #6a35c9;
  --text: #f6ecd2;
  --muted: #cdbb8a;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--text); }
body {
  font-family: "Noto Sans Sinhala", "Iskoola Pota", system-ui, sans-serif;
  overflow-x: hidden;
}

/* ---------- Background ---------- */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background:
  radial-gradient(ellipse at 50% 120%, #2a1a05 0%, var(--ink) 60%); }
.blob { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .42; will-change: transform; }
.blob.b1 { background: var(--gold);    left: -20vmax; top: -22vmax; animation: drift1 22s ease-in-out infinite alternate; }
.blob.b2 { background: var(--ruby);    right: -24vmax; top: 10vmax; opacity: .30; animation: drift2 26s ease-in-out infinite alternate; }
.blob.b3 { background: var(--violet);  left: 10vmax; bottom: -30vmax; opacity: .34; animation: drift3 30s ease-in-out infinite alternate; }
.blob.b4 { background: var(--emerald); right: -10vmax; bottom: -26vmax; opacity: .26; animation: drift1 28s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16vmax, 8vmax) scale(.9); } }
@keyframes drift3 { to { transform: translate(12vmax, -14vmax) scale(1.2); } }
.vignette { position: absolute; inset: 0; background:
  radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.72) 100%),
  repeating-linear-gradient(115deg, rgba(245,197,66,.035) 0 2px, transparent 2px 46px); }

canvas#gifts { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

/* ---------- Content ---------- */
main {
  position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px 48px; text-align: center; gap: 6px;
}
.gold-text {
  background: linear-gradient(100deg, var(--gold-lo) 0%, var(--gold) 25%, var(--gold-hi) 48%, var(--gold) 70%, var(--gold-lo) 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 5s linear infinite;
}
@keyframes shimmer { to { background-position: -220% 0; } }

.age {
  font-family: "Playfair Display", Georgia, serif; font-weight: 900;
  font-size: clamp(110px, 30vw, 270px); line-height: .9; margin: 0;
  letter-spacing: -.02em;
  filter: drop-shadow(0 6px 28px rgba(245,197,66,.35));
}
.hb {
  font-family: "Great Vibes", cursive; font-weight: 400;
  font-size: clamp(44px, 10vw, 96px); line-height: 1.05; margin: -.1em 0 0;
  filter: drop-shadow(0 4px 18px rgba(245,197,66,.3));
}
.sub { margin: 14px 0 28px; font-size: clamp(15px, 3.4vw, 19px); color: var(--muted); letter-spacing: .01em; }

.timer { display: flex; gap: clamp(8px, 2.4vw, 22px); justify-content: center; flex-wrap: nowrap; }
.unit {
  width: clamp(70px, 20vw, 140px);
  padding: clamp(12px, 2.6vw, 22px) 6px clamp(10px, 2vw, 16px);
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(20,16,10,.82), rgba(8,6,4,.88));
  border: 1px solid rgba(245,197,66,.55);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset, 0 10px 40px rgba(0,0,0,.55), 0 0 28px rgba(245,197,66,.14);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.num {
  display: block; font-family: "Playfair Display", Georgia, serif; font-weight: 700;
  font-size: clamp(34px, 9.5vw, 78px); line-height: 1; font-variant-numeric: tabular-nums;
  color: var(--gold-hi);
  text-shadow: 0 0 22px rgba(245,197,66,.45);
}
.num.tick { animation: tick .45s ease-out; }
@keyframes tick { 0% { transform: translateY(-8px); opacity: .35; } 100% { transform: none; opacity: 1; } }
.lbl { display: block; margin-top: 8px; font-size: clamp(12px, 2.8vw, 16px); color: var(--muted); font-weight: 600; }

.rsvp {
  margin-top: 34px; max-width: 560px; width: 100%;
  padding: 18px 22px; border-radius: 16px;
  background: rgba(10,8,6,.78); border: 1px solid rgba(245,197,66,.45);
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.rsvp p { margin: 0; font-size: clamp(15px, 3.6vw, 19px); line-height: 1.8; color: var(--text); }
.rsvp strong { color: var(--gold); font-weight: 700; }
.rsvp .btn {
  border: 0; cursor: pointer; font-family: inherit;
  display: inline-block; margin-top: 14px; padding: 11px 26px; border-radius: 999px;
  background: linear-gradient(120deg, var(--gold-lo), var(--gold), var(--gold-hi)); color: #1b1203;
  font-weight: 700; text-decoration: none; font-size: 16px;
  transition: transform .15s ease, box-shadow .15s ease;
}
.rsvp a.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,197,66,.4); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }

.contact { display: none; margin-top: 20px; text-align: center; }
.contact.show { display: block; }
.contact .k, .contact .n, .contact .msg { display: block; opacity: 0; transform: translateY(-70px); }
.contact .k { font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: clamp(20px, 5vw, 28px); color: var(--gold); letter-spacing: .02em; }
.contact .n { margin: 6px 0; font-family: "Playfair Display", Georgia, serif; font-weight: 900; font-size: clamp(34px, 9vw, 56px); color: var(--gold-hi); text-decoration: none; text-shadow: 0 0 22px rgba(245,197,66,.5); letter-spacing: .04em; }
.contact .msg { font-size: clamp(14px, 3.4vw, 17px); color: var(--muted); line-height: 1.8; }
.contact.show .k   { animation: dropIn .85s cubic-bezier(.3,1.4,.5,1) .05s forwards; }
.contact.show .n   { animation: dropIn .85s cubic-bezier(.3,1.4,.5,1) .6s forwards; }
.contact.show .msg { animation: dropIn .85s cubic-bezier(.3,1.4,.5,1) 1.15s forwards; }
@keyframes dropIn { to { opacity: 1; transform: none; } }
.done { display: none; font-family: "Great Vibes", cursive; font-size: clamp(40px, 9vw, 80px); margin: 0; }
body.arrived .timer { display: none; }
body.arrived .done { display: block; }

@media (max-width: 380px) { .timer { gap: 6px; } .unit { border-radius: 14px; } }
@media (prefers-reduced-motion: reduce) {
  .blob, .gold-text, .num.tick { animation: none !important; }
  .contact.show .k, .contact.show .n, .contact.show .msg { animation: none !important; opacity: 1; transform: none; }
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="vignette"></div>
</div>
<canvas id="gifts" aria-hidden="true"></canvas>

<main>
  <h1 class="age gold-text" aria-label="23">23</h1>
  <div class="hb gold-text">Happy Birthday</div>
  <p class="sub">මගේ 23 වැනි උපන්දිනයට තව ඉතිරි කාලය</p>

  <div class="timer" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="d">00</span><span class="lbl">දින</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">පැය</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="lbl">විනාඩි</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">තත්පර</span></div>
  </div>
  <p class="done gold-text">අද තමයි ඒ දවස! 🎉</p>

  <section class="rsvp">
    <p>ඔබගේ පැමිණීම තහවුරු කිරීම සඳහා <strong>ඔක්තෝබර් 20 ට පෙර</strong> කරුණාකර දැනුම් දෙන්න.</p>
    <button type="button" class="btn" id="rsvpBtn" aria-expanded="false" aria-controls="contact">පැමිණීම තහවුරු කරන්න</button>
    <div class="contact" id="contact">
      <span class="k">WhatsApp Number</span>
      <a class="n" href="https://wa.me/94762888719" target="_blank" rel="noopener">0762888719</a>
      <span class="msg">මෙම නම්බරයට කෙටි පණිවිඩයක් ලබා දෙන්න</span>
    </div>
  </section>
</main>

<script>
/* ===== සැකසුම් (මෙතනින් වෙනස් කරන්න පුළුවන්) ===== */
const TARGET = new Date(2026, 9, 28, 0, 0, 0);     // 2026 ඔක්තෝබර් 28, මධ්‍යම රාත්‍රියේ (මාසය 0 සිට: 9 = ඔක්තෝබර්)
const RSVP_LINK = "";                              // උදා: "https://wa.me/94771234567"

/* ===== Countdown ===== */
const el = { d: document.getElementById("d"), h: document.getElementById("h"), m: document.getElementById("m"), s: document.getElementById("s") };
const pad = (n) => String(n).padStart(2, "0");
let last = { d: "", h: "", m: "", s: "" };

function setVal(key, val) {
  if (last[key] === val) return;
  last[key] = val;
  const node = el[key];
  node.textContent = val;
  node.classList.remove("tick");
  void node.offsetWidth;
  node.classList.add("tick");
}

function update() {
  let diff = Math.floor((TARGET - new Date()) / 1000);
  if (diff <= 0) { document.body.classList.add("arrived"); return; }
  const d = Math.floor(diff / 86400); diff -= d * 86400;
  const h = Math.floor(diff / 3600);  diff -= h * 3600;
  const m = Math.floor(diff / 60);
  const s = diff - m * 60;
  setVal("d", pad(d)); setVal("h", pad(h)); setVal("m", pad(m)); setVal("s", pad(s));
}
update();
setInterval(update, 250);

const rsvpBtn = document.getElementById("rsvpBtn");
const contactBox = document.getElementById("contact");
rsvpBtn.addEventListener("click", () => {
  contactBox.classList.add("show");
  rsvpBtn.setAttribute("aria-expanded", "true");
});

/* ===== වැටෙන තෑගි පෙට්ටි ===== */
const canvas = document.getElementById("gifts");
const ctx = canvas.getContext("2d");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener("resize", resize);

const PALETTES = [
  { box: "#c2185b", lid: "#e0407f", rib: "#f5c542" },
  { box: "#0f9d7a", lid: "#2fc79f", rib: "#f5c542" },
  { box: "#6a35c9", lid: "#8b5cf0", rib: "#f5c542" },
  { box: "#d99a0b", lid: "#f5c542", rib: "#7a1230" },
  { box: "#161616", lid: "#2c2c2c", rib: "#f5c542" },
  { box: "#1f6fd1", lid: "#4a95f0", rib: "#fff1b8" }
];

function drawGift(s, p) {
  const w = s, h = s * 0.86, lidH = s * 0.26;
  ctx.save();
  ctx.shadowColor = "rgba(245,197,66,.35)"; ctx.shadowBlur = s * 0.35;
  // body
  ctx.fillStyle = p.box;
  ctx.fillRect(-w / 2, -h / 2 + lidH, w, h - lidH);
  ctx.shadowBlur = 0;
  // lid
  ctx.fillStyle = p.lid;
  ctx.fillRect(-w / 2 - s * 0.05, -h / 2, w + s * 0.1, lidH);
  // ribbon vertical
  const rw = s * 0.2;
  ctx.fillStyle = p.rib;
  ctx.fillRect(-rw / 2, -h / 2, rw, h);
  // ribbon horizontal on body
  ctx.fillRect(-w / 2, -h / 2 + lidH + (h - lidH) * 0.38, w, rw * 0.7);
  // bow
  ctx.beginPath();
  ctx.ellipse(-s * 0.17, -h / 2 - s * 0.07, s * 0.17, s * 0.1, -0.5, 0, Math.PI * 2);
  ctx.ellipse(s * 0.17, -h / 2 - s * 0.07, s * 0.17, s * 0.1, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath(); ctx.arc(0, -h / 2 - s * 0.03, s * 0.07, 0, Math.PI * 2);
  ctx.fillStyle = "#fff1b8"; ctx.fill();
  // highlight
  ctx.fillStyle = "rgba(255,255,255,.14)";
  ctx.fillRect(-w / 2, -h / 2 + lidH, w * 0.18, h - lidH);
  ctx.restore();
}

function drawTwentyThree(s) {
  ctx.save();
  ctx.font = `900 ${s}px "Playfair Display", Georgia, serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const g = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
  g.addColorStop(0, "#fff1b8"); g.addColorStop(.5, "#f5c542"); g.addColorStop(1, "#b8860b");
  ctx.shadowColor = "rgba(245,197,66,.6)"; ctx.shadowBlur = s * 0.4;
  ctx.fillStyle = g;
  ctx.fillText("23", 0, 0);
  ctx.restore();
}

const LETTERS = "HAPPYBIRTHDAY";
const LETTER_COLORS = ["#f5c542", "#fff1b8", "#ff5c9a", "#3fe0b5", "#a98bff", "#f5c542"];
function drawLetter(it) {
  ctx.save();
  ctx.font = `700 ${it.size}px "Playfair Display", Georgia, serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = it.col; ctx.shadowBlur = it.size * 0.45;
  ctx.fillStyle = it.col;
  ctx.fillText(it.ch, 0, 0);
  ctx.restore();
}

const items = [];
function spawn(initial) {
  const r = Math.random();
  const isNum = r < 0.10;
  const isLetter = !isNum && r < 0.42;
  const size = isNum ? 26 + Math.random() * 30 : isLetter ? 24 + Math.random() * 30 : 22 + Math.random() * 46;
  const depth = size / 68; // ලොකු ඒවා වේගවත්
  items.push({
    type: isNum ? "num" : isLetter ? "letter" : "gift",
    ch: LETTERS[(Math.random() * LETTERS.length) | 0],
    col: LETTER_COLORS[(Math.random() * LETTER_COLORS.length) | 0],
    pal: PALETTES[(Math.random() * PALETTES.length) | 0],
    size,
    x: Math.random() * W,
    y: initial ? Math.random() * H : -size * 2,
    vy: 40 + depth * 90 + Math.random() * 40,
    sway: 10 + Math.random() * 28,
    swaySpeed: .6 + Math.random() * 1.2,
    phase: Math.random() * Math.PI * 2,
    rot: (Math.random() - .5) * .8,
    vr: (Math.random() - .5) * .9,
    alpha: .55 + depth * .45
  });
}

const MAX = () => Math.max(18, Math.min(52, Math.round(W / 28)));
for (let i = 0; i < MAX() * 0.8; i++) spawn(true);

let prev = performance.now(), acc = 0, t = 0;
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05); prev = now; t += dt;
  ctx.clearRect(0, 0, W, H);

  acc += dt;
  if (acc > 0.45 && items.length < MAX()) { acc = 0; spawn(false); }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt;
    it.rot += it.vr * dt;
    const x = it.x + Math.sin(t * it.swaySpeed + it.phase) * it.sway;
    if (it.y - it.size * 2 > H) { items.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = it.alpha;
    ctx.translate(x, it.y);
    ctx.rotate(it.rot * .6);
    if (it.type === "gift") drawGift(it.size, it.pal); else if (it.type === "letter") drawLetter(it); else drawTwentyThree(it.size);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

if (reduce) {
  // චලනය අඩු කරන්න කියලා සකසලා තියෙන අයට: නිශ්චල තෑගි පෙට්ටි කිහිපයක් පමණක්
  for (const it of items) {
    ctx.save(); ctx.globalAlpha = it.alpha; ctx.translate(it.x, it.y); ctx.rotate(it.rot * .4);
    if (it.type === "gift") drawGift(it.size, it.pal); else if (it.type === "letter") drawLetter(it); else drawTwentyThree(it.size);
    ctx.restore();
  }
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
